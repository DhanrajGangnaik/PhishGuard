<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="page-glow glow-left"></div>
    <div class="page-glow glow-right"></div>

    <nav class="navbar">
        <div class="nav-shell">
            <a class="brand" href="{{ url_for('index') }}">
                <span class="brand-dot"></span>
                <span>PhishGuard</span>
            </a>
            <div class="nav-links">
                <a href="{{ url_for('index') }}">Analyze</a>
                <a href="{{ url_for('dashboard') }}">Dashboard</a>
                <a href="{{ url_for('history') }}">History</a>
                <a href="{{ url_for('about') }}">About</a>
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer-shell">
        <div class="footer-card">
            <div>
                <p class="eyebrow">Laptop-Ready Cybersecurity Demo</p>
                <h3>Explainable phishing detection for URLs and email content.</h3>
            </div>
            <div class="footer-copy">PhishGuard • Flask • SQLite • Container-ready deployment</div>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
